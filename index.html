<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Zoom bewusst deaktiviert (Pinch- UND Doppeltipp-Zoom) – auf Wunsch
         abweichend von WCAG 1.4.4, das Zoom bis 200% empfiehlt. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- theme-color wird zur Laufzeit an den aktiven Modus angepasst (siehe useTheme) -->
    <meta name="theme-color" content="#faf6ee" />
    <!-- Farbschema VOR dem ersten Paint setzen: sonst zeigt der Dark Mode beim
         Start kurz den hellen Look (die Tokens hängen an data-theme) und blendet
         dann sichtbar um. useTheme übernimmt danach und hält es reaktiv;
         die Farbwerte entsprechen META_THEME_COLOR dort. -->
    <script>
      (function () {
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
      })();
    </script>
    <meta name="description" content="Listly – vegane Einkaufsliste mit Kaufverlauf, offline nutzbar." />
    <title>Listly</title>
  </head>
  <body>
    <div id="root">
      <!-- Start-Platzhalter, bis React übernimmt (ersetzt diesen Inhalt beim
           Start). position:fixed hält ihn aus dem Layoutfluss – kein
           Layout-Shift (CLS). Der Hinweis erscheint erst, wenn die App nach
           einigen Sekunden noch immer nicht läuft (siehe .boot__hint). -->
      <div class="boot">
        <span class="boot__logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 11-1 9" /><path d="m19 11-4-7" /><path d="M2 11h20" />
            <path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4" />
            <path d="M4.5 15.5h15" /><path d="m5 11 4-7" /><path d="m9 11 1 9" />
          </svg>
        </span>
        <p class="boot__hint">
          Listly startet nicht? Bitte die Seite neu laden.
          <small>Entwicklung: die App über einen Server öffnen (<code>npm run dev</code>),
            nicht per Doppelklick als Datei.</small>
        </p>
      </div>
    </div>
    <noscript style="display:block; padding:1.5rem; font-family: system-ui, sans-serif;">
      Listly benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
